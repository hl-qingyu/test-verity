[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "test-verity-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn==0.34.2",
  "SQLAlchemy==2.0.41",
  "psycopg[binary]==3.2.13",
  "pydantic-settings==2.10.1",
  "alembic==1.16.2",
  "cryptography==50.0.1",
  "markdown-it-py==4.2.0",
  "openpyxl==3.1.5",
  "xlrd==2.0.2",
  "pywinpty==3.1.2; sys_platform == 'win32'",
  "websockets==16.0",
]

[project.optional-dependencies]
dev = ["ruff==0.12.0", "httpx==0.28.1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
