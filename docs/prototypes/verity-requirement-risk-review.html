.page-jump{display:flex;flex-direction:column;gap:4px;min-width:0;max-width:100%}.page-jump>.page-jump-controls{display:flex;flex-wrap:nowrap;align-items:center;gap:6px;white-space:nowrap}.page-jump-controls label{display:flex;align-items:center;gap:6px}.page-jump .page-jump-controls input{box-sizing:border-box;width:66px;min-width:0;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--white);color:inherit}.page-jump-controls button{flex-shrink:0;margin:0}.page-jump .form-error{margin:0;white-space:normal;overflow-wrap:anywhere;font-size:12px;color:#af493e}.page-jump .form-error:empty{display:none}
</style>
<style id="batch-review-polish">
#dialog.cg-review-dialog {
  width: min(1180px, calc(100vw - 40px));
  height: min(840px, calc(100svh - 40px));
  max-height: calc(100svh - 40px);
  border-radius: 16px;
}
.cg-review-dialog[open] {
  display: flex;
  flex-direction: column;
}
#dialog.cg-review-dialog > .modal-head,
#dialog.cg-review-dialog > .modal-footer {
  flex-shrink: 0;
}
#dialog.cg-review-dialog > .modal-head {
  padding: 20px 24px;
}
#dialog.cg-review-dialog > .modal-head h2 {
  font-size: 18px;
}
#dialog.cg-review-dialog > .modal-body {
  display: flex;
  flex-direction: column;
  flex: 1;
  min-height: 0;
  max-height: none;
  overflow: hidden;
  background: #f5f7f3;
  padding: 18px;
  gap: 16px;
}
.cg-review-simple-head {
  display: grid;
  align-items: center;
  grid-template-columns: minmax(0, 1fr) minmax(230px, 320px);
  padding: 16px 20px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: white;
  gap: 24px;
}
.cg-review-simple-head strong {
  font-size: 17px;
  line-height: 1.6;
}
.cg-review-simple-head > div {
  min-width: 0;
}
.cg-review-simple-head .theme-picker,
.cg-review-content > .theme-picker {
  width: 100%;
}
.cg-review-simple-head .hint {
  line-height: 1.7;
}
.cg-review-simple-head .cg-failure {
  display: inline-block;
  padding: 4px 8px;
  font-size: 12px;
  margin-left: 8px;
  vertical-align: middle;
}
.cg-review-grid {
  display: grid;
  flex: 1;
  min-height: 0;
  border: 1px solid var(--line);
  overflow: hidden;
  grid-template-columns: 320px minmax(0, 1fr);
  border-radius: 12px;
  background: white;
}
.cg-review-list {
  display: flex;
  flex-direction: column;
  min-height: 0;
  border-right: 1px solid var(--line);
  background: #f8faf6;
}
.cg-review-search {
  border-bottom: 1px solid var(--line);
  margin: 0;
  padding: 16px;
  font-size: 12px;
  font-weight: 600;
  color: #526556;
}
.cg-review-dialog input[type='checkbox'] {
  accent-color: var(--green);
  width: 16px;
  height: 16px;
  flex-shrink: 0;
}
.cg-review-list-scroll {
  flex: 1;
  min-height: 0;
  overflow: auto;
  scrollbar-gutter: stable;
  padding: 8px;
}
.cg-review-row {
  display: flex;
  align-items: flex-start;
  margin: 0 0 7px;
  padding: 12px;
  border: 1px solid transparent;
  border-radius: 9px;
  gap: 10px;
  background: white;
}
.cg-review-row > button {
  min-width: 0;
  flex: 1;
  padding: 0;
  text-align: left;
  background: transparent;
  border: 0;
  display: grid;
  gap: 6px;
  box-shadow: none;
  overflow-wrap: anywhere;
  white-space: normal;
}
.cg-review-row:hover {
  border-color: #d4dfd1;
}
.cg-review-row.active {
  border-color: #adc9b3;
  background: #eaf3ec;
  box-shadow: inset 3px 0 0 var(--green);
}
.cg-review-row > input {
  margin: 3px 0 0;
}
.cg-review-row strong {
  font-size: 13px;
  font-weight: 600;
  line-height: 1.65;
}
.cg-review-row small {
  font-size: 11px;
  color: #778477;
}
.cg-review-row .cg-failure {
  margin: 0;
  padding: 6px 8px;
  color: #9c4b32;
}
.cg-review-list .cg-review-pagination {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto auto;
  gap: 8px;
  padding: 12px 16px;
  background: white;
  color: var(--muted);
}
.cg-review-pagination {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px;
  border-top: 1px solid var(--line);
  font-size: 12px;
  gap: 8px;
  flex-wrap: wrap;
}
.cg-review-pagination button {
  padding: 6px 9px;
  font-size: 12px;
}
.cg-review-list .cg-review-pagination > .row {
  display: contents;
}
.cg-review-list .cg-review-pagination button {
  padding: 7px 10px;
  border-radius: 7px;
}
.cg-review-list .page-jump {
  grid-column: 1 / -1;
  align-items: flex-end;
}
.cg-review-content {
  min-width: 0;
  overflow: auto;
  scrollbar-gutter: stable;
  overflow-wrap: anywhere;
  padding: 24px 28px;
}
.cg-review-content > .between:first-child {
  gap: 12px;
}
.cg-review-content > h3 {
  font-size: 21px;
  line-height: 1.65;
  margin: 16px 0 20px;
  font-weight: 650;
}
.cg-review-content > .theme-picker {
  max-width: 340px;
  margin-bottom: 20px;
}
.cg-review-value {
  padding: 16px 18px;
  margin: 12px 0;
  background: #f7f9f5;
  border: 1px solid #e7ece3;
  border-radius: 10px;
}
.cg-review-value h4 {
  font-size: 12px;
  color: #53705a;
  margin-bottom: 9px;
  font-weight: 600;
}
.cg-review-value > div {
  white-space: pre-wrap;
  font-size: 13px;
  line-height: 1.85;
  color: #344b3b;
}
.cg-review-diff p {
  white-space: pre-wrap;
  font-size: 13px;
  line-height: 1.9;
}
.cg-review-content > .evidence {
  margin-top: 12px;
  padding: 14px 16px;
  background: white;
  border-radius: 10px;
}
.cg-review-footer {
  width: 100%;
}
.cg-review-footer .row {
  flex-wrap: wrap;
  gap: 8px;
}
.cg-review-content > .evidence > summary {
  font-size: 12px;
  font-weight: 600;
  color: #566b59;
  cursor: pointer;
}
#dialog.cg-review-dialog .cg-review-footer {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  padding: 16px 24px;
  gap: 6px 20px;
  background: white;
}
.cg-review-footer > .check {
  grid-column: 1;
  grid-row: 1;
  font-size: 13px;
  font-weight: 600;
  margin: 0;
}
.cg-review-footer > .between {
  display: contents;
}
.cg-review-footer > .between > .hint {
  grid-column: 1;
  grid-row: 2;
  margin: 0;
  font-size: 11px;
}
.cg-review-footer > .between > .row {
  grid-column: 2;
  grid-row: 1 / span 2;
}
.cg-review-footer button {
  min-width: 84px;
}
@media (max-width: 900px) {
  .cg-review-grid {
    grid-template-columns: 280px minmax(0, 1fr);
  }
  .cg-review-content {
    padding: 20px;
  }
}
@media (max-width: 620px) {
  #dialog.cg-review-dialog {
    width: calc(100vw - 16px);
    height: calc(100svh - 16px);
    max-height: calc(100svh - 16px);
    border-radius: 12px;
  }
  #dialog.cg-review-dialog > .modal-head {
    padding: 16px;
  }
  #dialog.cg-review-dialog > .modal-body {
    overflow: auto;
    padding: 12px;
    gap: 12px;
  }
  .cg-review-grid {
    display: block;
    flex: none;
    overflow: visible;
    min-height: 0;
  }
  .cg-review-list {
    border-right: 0;
    border-bottom: 1px solid var(--line);
  }
  .cg-review-list-scroll {
    max-height: 180px;
    flex: none;
  }
  .cg-review-simple-head {
    grid-template-columns: minmax(0, 1fr);
    padding: 14px;
    gap: 14px;
  }
  .cg-review-simple-head .cg-failure {
    margin: 6px 0 0;
  }
  .cg-review-search {
    padding: 12px 14px;
  }
  .cg-review-content {
    overflow: visible;
    padding: 18px 14px;
  }
  .cg-review-content > h3 {
    font-size: 18px;
  }
  .cg-review-value {
    padding: 14px;
  }
  #dialog.cg-review-dialog .cg-review-footer {
    grid-template-columns: minmax(0, 1fr);
    padding: 12px 16px;
    gap: 7px;
  }
  .cg-review-footer > .between > .row {
    grid-column: 1;
    grid-row: 3;
    display: flex;
    width: 100%;
    margin-top: 5px;
    gap: 8px;
  }
  .cg-review-footer button {
    flex: 1;
    min-width: 0;
  }
}

.cg-review-simple-head .field-label{width:100%;min-width:0}
.cg-review-content>.cg-review-item-category{display:block;max-width:340px;padding:0;margin:0 0 20px;background:transparent}
.cg-review-item-category .theme-picker{width:100%}
.cg-review-content>.between:first-child{gap:12px}
#dialog.cg-review-dialog>.modal-footer{background:white;padding:16px 24px}
@media(max-width:620px){#dialog.cg-review-dialog>.modal-footer{padding:12px 16px}}

</style>
</head>

function upgradeCaseFormat(state){
  if(state.caseFormat===2)return state;
  for(const p of state.projects){p.cases=p.cases.map((c,i)=>normalizeCase(c,i+1));if(p.sample)p.cases.unshift(...clone(ACCESSORIES_CASES.filter(c=>!p.cases.some(x=>x.id===c.id))));}
  const legacyNames=new Set(['编号','来源与版本','关联规则','证据','确认状态','用例标题','场景类型','优先级','前置条件','测试数据要求','操作步骤','每步预期结果','清理要求']);
  for(const t of state.templates.filter(t=>t.module==='generate')){const old=clone(t);t.history=[...(t.history||[]),old];t.metadataFields=old.fields.filter(f=>['编号','来源与版本','关联规则','证据','确认状态'].includes(f.name));t.fields=[...caseTemplateFields(),...old.fields.filter(f=>!legacyNames.has(f.name)&&!CASE_COLUMNS.some(x=>x[1]===f.name))];t.version++;t.caseFormat=2;}
  for(const skill of state.skills.filter(s=>s.module==='generate'||s.module==='coverage')){skill.history.push({version:skill.version,time:'14 列格式升级前',name:skill.name,input:skill.input,instructions:skill.instructions,example:skill.example});skill.instructions+=CASE_SKILL_RULES;skill.version++;if(skill.module==='generate')skill.example='功能模块：配件订货\n功能结构：确认信息\n用例描述：确认订货\n验证用例子项：后台校验配件下架不能下单\n操作步骤：APP 完成信息填写后，在品牌方后台下架已选配件，再提交订货。\n预期结果：提示规格不可下单\n测试结果：未执行';}
  state.caseFormat=2;return state;
}

function changeRequirementGroups(changes,order=P().requirementOrder||[],categories=null){

 if(!changes.length&&categories===null)return '未选择可调整的验收点';
 if(new Set(changes.map(c=>c.id)).size!==changes.length)return '分类调整重复';
 for(const c of changes){if(!p.rules.some(r=>r.id===c.id))return '验收点已不存在，请刷新';if(typeof c.module!=='string'||typeof c.feature!=='string'||c.module.length>80||c.feature.length>80||(!c.module&&c.feature))return '分类名称无效：先填写模块，名称最多80字';}
 const categoriesAfter=clone(categories??categoriesBefore);
 for(const c of changes)if(c.module){if(!categoriesAfter.some(x=>x.module===c.module))categoriesAfter.push({module:c.module,feature:''});if(c.feature&&!categoriesAfter.some(x=>x.module===c.module&&x.feature===c.feature))categoriesAfter.push({module:c.module,feature:c.feature});}
 if(categoriesAfter.some(c=>typeof c.module!=='string'||!c.module.trim()||c.module.length>80||typeof c.feature!=='string'||c.feature.length>80))return '分类名称不能为空且最多80字';
 const before=changes.map(c=>{const r=p.rules.find(r=>r.id===c.id);return {id:r.id,module:r.module||'',feature:r.feature||''};});
 if(JSON.stringify(before)===JSON.stringify(changes)&&JSON.stringify(p.requirementOrder||[])===JSON.stringify(order)&&JSON.stringify(categoriesBefore)===JSON.stringify(categoriesAfter))return '';
 requirementUndo={projectId:p.id,before,after:clone(changes),orderBefore:clone(p.requirementOrder||[]),orderAfter:clone(order),categoriesBefore,categoriesAfter};
 for(const c of changes)Object.assign(p.rules.find(r=>r.id===c.id),{module:c.module,feature:c.feature});
 p.requirementOrder=clone(order);p.requirementCategories=clone(categoriesAfter);
 (p.classificationHistory??=[]).push({time:new Date().toLocaleString(),before,after:clone(changes),categoriesBefore,categoriesAfter,kind:'调整分类'});
 return '';
}
function undoRequirementGroups(){
 const u=requirementUndo,p=P();if(!u||u.projectId!==p.id)return '当前项目没有可撤销的分类调整';
 if(u.after.some(c=>{const r=p.rules.find(r=>r.id===c.id);return !r||r.module!==c.module||r.feature!==c.feature;})||JSON.stringify(p.requirementOrder||[])!==JSON.stringify(u.orderAfter)||JSON.stringify(p.requirementCategories||[])!==JSON.stringify(u.categoriesAfter))return '分类已再次变化，不能覆盖后续调整';
 for(const c of u.before)Object.assign(p.rules.find(r=>r.id===c.id),{module:c.module,feature:c.feature});
 p.requirementOrder=clone(u.orderBefore);p.requirementCategories=clone(u.categoriesBefore);
 (p.classificationHistory??=[]).push({time:new Date().toLocaleString(),before:u.after,after:u.before,kind:'撤销分类调整'});
 requirementUndo=null;return '';
}
function moveRequirementFeature(from,target,beforeFeature=null){
 const rows=P().rules.filter(r=>(r.module||'')===from[0]&&(r.feature||'')===from[1]);
 const catalog=requirementCatalog();if(!catalog.some(c=>c.module===from[0]&&c.feature===from[1]))return '功能点已不存在';
 if(!target||!from[1])return '请使用调整分类填写模块和功能点';
 if(target!==from[0]&&catalog.some(r=>r.module===target&&r.feature===from[1]))return '目标模块已有同名功能点，请先改名；不会自动合并';
 const order=[...new Set([...(P().requirementOrder||[]),...catalog.filter(c=>c.feature).map(c=>requirementOrderKey(c.module,c.feature))])].filter(k=>k!==requirementOrderKey(...from)&&k!==requirementOrderKey(target,from[1]));
 const before=beforeFeature===from[1]?-1:order.indexOf(requirementOrderKey(target,beforeFeature));
 order.splice(before<0?order.length:before,0,requirementOrderKey(target,from[1]));
 const next=catalog.map(c=>c.module===from[0]&&c.feature===from[1]?{module:target,feature:from[1]}:c);if(!next.some(c=>c.module===target&&c.feature===''))next.push({module:target,feature:''});return changeRequirementGroups(rows.map(r=>({id:r.id,module:target,feature:from[1]})),order,next);
}
function dropRequirement(drag,target){

 if(drag.kind!=='rule'||target.length!==2||!target[0]||!target[1])return '请把验收点拖到具体功能点';
 if(!requirementCatalog().some(c=>c.module===target[0]&&c.feature===target[1]))return '目标功能点已不存在';

}

function shiftRequirementFeature(scope,direction){const names=[...new Set(requirementCatalog().filter(r=>r.module===scope[0]&&r.feature).map(r=>r.feature))].sort((a,b)=>requirementFeatureRank(scope[0],a)-requirementFeatureRank(scope[0],b));const i=names.indexOf(scope[1]);if(i<0||i+direction<0||i+direction>=names.length)return '已到达边界';return moveRequirementFeature(scope,scope[0],direction<0?names[i-1]:names[i+2]??null);}

function saveRequirementClassification(d){

 if(c.kind!=='rule'&&!catalog.some(x=>x.module===c.scope[0]&&(c.kind==='module'||x.feature===c.scope[1])))return '分类已不存在';
 if(c.kind!=='rule'&&(!module||(c.kind==='feature'&&!feature)))return '分类名称不能为空';
 if(c.kind==='module'&&module!==c.scope[0]&&catalog.some(x=>x.module===module))return '已有同名模块，不自动合并';

function saveRequirement(r,d,mode){
 const confirm=mode===true||mode==='confirm',supplement=mode==='supplement';
 const fields=['title','role','pre','action','expected','question','resolution'];
 const values=Object.fromEntries(fields.map(k=>[k,String(d[k]||'').trim()]));
  if(!values.title||!values.action||!values.expected)return '请填写规则名称、操作和预期结果';
 if(supplement&&!values.question)return '请填写需要补充的问题';
 if(!supplement&&values.question&&!values.resolution)return '请先解决待补充问题并填写处理结论';
 if(!supplement&&/未说明|待确认|尚未明确|待补充/.test(values.expected))return '请将预期结果中的未明确内容补充完整';
 if(confirm&&r.origin==='AI 建议'&&d.adopt!=='on')return '请明确勾选采纳 AI 建议';
 const status=confirm?'已确认':supplement?'待补充':'待审核';
 const changed=fields.some(k=>(k==='question'?requirementQuestion(r):r[k]||'')!==values[k])||(d.sources!==undefined&&JSON.stringify(d.sources)!==JSON.stringify(requirementSourcesFor(r)));
 if(!changed&&r.status===status)return '';
 const prior=clone(r);delete prior.history;
 r.history=[...(r.history||[]),{...prior,version:r.version||1,recordedAt:new Date().toLocaleString()}];
 Object.assign(r,values,{status,version:(r.version||1)+1,sources:clone(d.sources??requirementSourcesFor(r))});
 r.confirmedBy=confirm?'当前用户（演示）':'';
 r.confirmedAt=confirm?new Date().toLocaleString():'';
 if(changed||prior.status!==status){r.coverage='待判断';P().tasks.filter(t=>(t.snapshot?.rules||[]).some(x=>x.id===r.id)).forEach(t=>t.stale=true);}
 return '';
}

v><span class="form-error" role="alert"></span></div></div></nav>`:''}</section></div><p class="hint mt">HTML演示 · 原始分析和人工补充分别保留。</p>`;

  openModal('分析范围与边界',`<div class="row">${tag(r.id)}${riskBadge(r.state)}</div>${review}<h3 class="mt">固定资料 · ${r.materials.length} 份</h3>${r.materials.map(m=>`<div class="evidence"><strong>${esc(m.name)} · ${esc(m.version||'当次快照')}</strong><p>${esc(m.scope||'所选文件')}</p><p class="hint">${esc(m.state||'未读取')}${m.sha?' · 提交 '+esc(m.sha):''}</p>${m.files?.length?'<p class="hint">'+m.files.map(f=>esc(typeof f==='string'?f:f.path)).join('<br>')+'</p>':''}</div>`).join('')}${r.state==='已完成'?'<h3 class="mt">本次分析结论</h3><p>'+esc(r.summary)+'</p>':''}<h3 class="mt">本次关注点</h3><p>${esc(r.focus||'未设置额外关注点')}</p><h3 class="mt">分析边界</h3><ul>${r.boundaries.map(b=>`<li>${esc(b)}</li>`).join('')}</ul><details class="evidence mt"><summary>分析过程与诊断</summary><p>发起人：${esc(r.owner)} · 使用配置：${esc(r.model)}</p><p>资料：${r.materials.length} 份 · 状态：${esc(r.state)}</p><p>${esc(r.error||'本地交互演示，无真实模型请求或响应耗时。')}</p><p class="hint">正式接入时沿用现有安全诊断；不展示密钥、模型思考或上游原文，不伪造进度百分比。</p></details>`,btn('关闭','close'),true);
}
function riskDetail(id) {
 const report=riskSelected(),r=riskItems(report).find(x=>x.id===id);if(!r)return;
 const h=report.handling?.[id]||{status:'待确认',note:'',history:[],revision:0};
  const warnings=report.reviewWarnings?.filter(w=>w.riskId===id)||[];
  const coverage=warnings.filter(w=>w.code==='invalid_coverage');
  const review=warnings.length?`<section class="notice">${coverage.length?`<p><strong>${esc(id)} 在 ${coverage.length} 个资料片段上的功能归属与本风险不一致，需人工核对。</strong></p><details><summary>查看片段与功能归属</summary><ul>${coverage.map(w=>`<li>${esc(w.source||'资料')} · ${esc(w.location||w.path)}：片段标注“${esc((w.segmentFunctions||[]).join('、')||'未提供')}”；${esc(id)} 归属“${esc((w.riskFunctions||[r.feature]).join('、'))}”。</li>`).join('')}</ul></details>`:''}${warnings.filter(w=>w.code!=='invalid_coverage').map(w=>`<p>待人工核对：${esc(w.path)} · ${esc(w.code)}</p>`).join('')}</section>`:'';
 modalContext={type:'risk-detail',project:P().id,report:report.id,id,revision:h.revision};
  openModal(r.id+' · 风险详情',`<div class="row">${riskBadge(r.level)}${tag(r.type)}${tag(r.feature)}${riskBadge(h.status)}</div><h2 class="mt">${esc(r.title)}</h2>${review}${r.origin?`<p class="hint">人工新增 · ${esc(r.origin.actor)} · ${esc(r.origin.time)} · 来源会话 ${esc(r.origin.sessionId)} / 消息 ${r.origin.messageIndex+1}</p><details class="evidence"><summary>来源聊天（非原文依据）</summary><p>${esc(r.origin.quote)}</p></details>`:''}<p class="mt">${esc(r.description)}</p><section class="risk-detail-section"><h3>原文依据 <span class="hint">· 当次固定版本</span></h3>${r.evidence.map(e=>`<div class="evidence"><strong>${esc(e.source)}</strong><p class="hint">${esc(e.location)}</p><blockquote>${esc(e.text)}</blockquote></div>`).join('')}</section><div class="risk-detail-grid"><section><h3>可能影响</h3><p>${esc(r.impact)}</p></section><section><h3>待确认事项</h3><p>${esc(r.question)}</p></section></div><section class="risk-detail-section"><h3>完善建议 <span class="badge">需人工确认</span></h3><p>${esc(r.suggestion)}</p><p class="hint mt">取舍：${esc(r.tradeoff)}</p></section><section class="risk-detail-section"><h3>人工处理</h3><p class="hint mb">修改状态不会改写原分析结论。标记已解决不等于运行验证通过。</p><form id="riskHandleForm">${requirementSelect('处理状态','status',RISK_STATUSES.map(x=>({value:x,label:x})),h.status)}${label('处理结论','<textarea name="note" rows="3" maxlength="3000" placeholder="记录确认结论、补充资料位置或不适用原因">'+esc(h.note)+'</textarea>','mt')}</form><details class="evidence mt"><summary>处理记录 · ${h.history.length} 条</summary>${h.history.slice().reverse().map(a=>`<div class="mt"><strong>${esc(a.to)}</strong><p class="hint">${esc(a.actor)} · ${esc(a.time)} · 原状态 ${esc(a.from)}</p><p>${esc(a.note)}</p></div>`).join('')||'<p class="hint mt">尚无人处理。</p>'}</details></section>`,btn('围绕此风险追问','local-session-risk-chat',r.id,'ghost')+btn('取消','close')+btn('保存处理','risk-save','','primary'),true);
 document.getElementById('dialog').classList.add('prototype-editor-dialog');
}
function riskSaveHandling(context,data) {
 if(context?.project!==P().id)return '项目已切换，请重新打开风险。';
 const report=riskReports().find(x=>x.id===context.report);if(!riskItems(report).some(x=>x.id===context.id))return '报告或风险不存在。';
 const old=report.handling[context.id]||{status:'待确认',note:'',revision:0,history:[]};
 if(old.revision!==context.revision)return '处理记录已变化，请重新打开后核对。';
 if(!RISK_STATUSES.includes(data.status))return '请选择有效状态。';
 const note=String(data.note||'').trim();if(note.length>3000)return '处理结论最多3000字。';
 if(data.status!=='待确认'&&!note)return '请填写确认结论、补充依据或不适用原因。';
 if(data.status===old.status&&note===old.note)return '';
 report.handling[context.id]={status:data.status,note,revision:old.revision+1,history:[...old.history,{from:old.status,to:data.status,note,actor:S.role+'（演示账号）',time:new Date().toLocaleString()}]};save();return '';
}
function riskNew(retry=null) {
 modalContext={type:'risk-new',project:P().id,retry:retry?.id||''};
 openModal(retry?'重新发起需求分析':'新建需求分析',`<form id="riskNewForm"><div class="form-grid">${label('报告名称',inp('title',retry?retry.title+' · 重新分析':'需求风险分析','','text',true),'span2')}<section class="evidence span2"><strong>结果直接保存为风险报告</strong><p>按功能集中呈现问题、依据、影响和完善建议，无需选择采纳，不自动生成或覆盖验收点。</p></section>${retry?`<div class="span2"><h3>沿用原报告的所选资料快照</h3><p>${retry.materials.map(m=>esc(m.name)).join('；')}</p><p class="hint">本次新建报告，原结果与人工处理结论保留。需要变更资料范围时请新建分析。</p></div>`:requirementSources()}${label('补充关注点','<textarea name="focus" rows="3" maxlength="3000" placeholder="例如：重点检查取消规则、异常流程和导出范围">'+esc(retry?.focus||'')+'</textarea>','span2')}<div class="evidence span2"><strong>本次使用：${esc(personalAI().name||'个人配置未设置')}</strong><p class="hint">模型：${esc(personalAI().model||'未设置')} · 重试使用当前操作者本人配置</p><p>后台执行，可离开页面；仅发起人可取消，失败后人工重试。</p></div><p class="hint span2">HTML 原型仅登记范围，不读取或发送实际资料。提交后演示明确失败状态；完整结果请使用“查看示例报告”。</p></div></form>`,btn('取消','close')+btn('开始分析（演示）','risk-start','','primary'),true);
 document.getElementById('dialog').classList.add('prototype-editor-dialog','requirement-analysis-dialog');
 const form=document.getElementById('riskNewForm');form?.querySelectorAll('[name=sourceDoc]').forEach(x=>{const d=P().docs.find(d=>d.id===x.value);if(d?.type==='LINK'){x.checked=false;x.disabled=true;x.closest('.analysis-source-card').insertAdjacentHTML('beforeend','<p class="hint">链接未采集正文，当前不可选择。</p>');}});
}
function riskStart() {
 const c=modalContext,data=formData('riskNewForm');if(!data||c?.type!=='risk-new'||c.project!==P().id)return;
 if(!data.title.trim()||data.title.length>200)return error('报告名称为1–200字。');
 const form=document.getElementById('riskNewForm'),previous=riskReports().find(r=>r.id===c.retry);
 let materials=previous?clone(previous.materials):[];
 if(!previous){
  const selected=[...form.querySelectorAll('[name=sourceDoc]:checked')].map(x=>currentDocs().find(d=>d.id===x.value));
  if(!selected.length||selected.some(d=>!d||d.type==='LINK'))return error('请至少选择一份可读取的资料；未采集链接不可选。');
  for(const d of selected){const snapshot=requirementAnalysisSnapshot(d,requirementAnalysisRole(d),form);if(d.type==='GITHUB'&&!snapshot.files?.length)return error('每份GitHub资料至少选择一个文件。');materials.push({...snapshot,scope:d.type==='GITHUB'?'本次勾选文件':'完整所选版本（尚未读取）',state:'未读取'});}
 }
 const p=P(),r={id:'RR-'+crypto.randomUUID().slice(0,8),title:data.title.trim(),time:new Date().toLocaleString(),owner:S.role,model:personalAI().name||'个人配置未设置',state:'分析中',demo:false,focus:data.focus,materials,features:[],risks:[],handling:{},notes:[],boundaries:['HTML 原型未执行实际读取或模型调用，没有真实分析结论。'],retryOf:c.retry};
 riskRunning.add(p.id+':'+r.id);riskReports(p).unshift(r);riskChoose(r.id);save();closeModal();navigate('requirements');
 setTimeout(()=>{riskRunning.delete(p.id+':'+r.id);if(r.state!=='分析中')return;r.state='失败';r.error='此 HTML 原型未连接分析服务，所选范围已保存，未发送资料、未生成风险结论。';save();if(P().id===p.id&&page==='requirements')render();},1600);
}
function riskCancel(report,actor=S.role) {if(report.state!=='分析中'||report.owner!==actor)return false;report.state='已取消';report.error='由发起人取消，未生成分析结论。';save();return true;}
function riskAction(action,id) {
 if(action==='risk-page'){const page=Number(id);if(!Number.isInteger(page)||page<1)return;riskCurrentPage=page;render();return;}
 if(['risk-source','risk-cumulative-feature','risk-level','risk-status','risk-clear','risk-history'].includes(action))riskCurrentPage=1;
 if(action==='risk-source'){riskSourceFilter=id;riskFeatureFilter='';riskView.level='全部';riskView.status='全部';render();return;}
 if(action==='risk-cumulative-feature'){riskFeatureFilter=id;render();return;}
 if(action==='risk-source-chat'){const report=riskReports().find(r=>r.id===id);if(!report)return;riskChoose(id);localSessionAction('local-session-from-report','');return;}
 if(action==='risk-cumulative-detail'||action==='risk-cumulative-chat'){
  let ids;try{ids=JSON.parse(id);}catch{return;}if(!Array.isArray(ids)||ids.length!==2)return;
  const report=riskReports().find(r=>r.id===ids[0]);if(!riskItems(report).some(r=>r.id===ids[1]))return;
  riskView.project=P().id;riskView.report=report.id;
  if(action==='risk-cumulative-detail')riskDetail(ids[1]);else localSessionAction('local-session-risk-chat',ids[1]);return;
 }
 if(action==='risk-home'){riskView.legacy=false;render();return;}
 if(action==='risk-legacy'){return;}
 if(action==='risk-new'||action==='risk-import'){riskImportModal();return;}
 if(action==='risk-import-save'){riskImportSave();return;}
 if(action==='risk-demo'){let r=riskReports().find(r=>r.id==='RR-DEMO');if(!r){r=riskDemo();riskReports().unshift(r);save();}riskChoose(r.id);render();return;}
 if(action==='risk-history'){riskSourceFilter='';riskFeatureFilter='';riskListQuery='';localSessionOpen=false;closeModal();render();return;}
 if(action==='risk-report'){riskChoose(id);if(localSessionOpen){const report=riskReports().find(r=>r.id===id);if(report)localSessionAttachReport(report);}closeModal();render();return;}
 if(action==='risk-scope'){riskScope(id);return;}
 if(action==='risk-detail'){riskDetail(id);return;}
 if(action==='risk-save'){const d=formData('riskHandleForm');if(!d)return;const message=riskSaveHandling(modalContext,d);if(message)return error(message);closeModal();render();toast('处理记录已保存（本地演示）');return;}
 if(action==='risk-start'){riskStart();return;}
 if(action==='risk-retry'){const r=riskReports().find(r=>r.id===id);if(r&&['失败','已取消'].includes(r.state))riskNew(r);return;}
  if(action==='risk-candidate'){const r=riskReports().find(r=>r.id===id);if(r?.candidate)download('requirement-analysis-'+r.id+'-ai-candidate.txt',r.candidate);return;}
  if(action==='risk-revalidate'){const r=riskReports().find(r=>r.id===id);if(!r?.candidate||r.state!=='失败'||r.owner!==S.role)return;openModal('重新校验候选（演示）','<p>此HTML没有真实AI候选与服务端校验，不能将演示结果冒充已入库报告。</p>',btn('关闭','close'));return;}
 if(action==='risk-cancel'){const r=riskReports().find(r=>r.id===id);if(!r||r.owner!==S.role||r.state!=='分析中')return;openModal('取消本次分析？','<p>保留本次所选范围，停止本次分析；后续可人工重新发起。</p>',btn('继续分析','close')+btn('确认取消','risk-cancel-confirm',id,'danger'));modalContext={type:'risk-cancel',project:P().id};return;}
 if(action==='risk-cancel-confirm'){const r=riskReports().find(r=>r.id===id);if(modalContext?.project!==P().id||!r||!riskCancel(r))return;closeModal();render();return;}
 if(action==='risk-feature')riskView.feature=id;
 if(action==='risk-level')riskView.level=id;
 if(action==='risk-status')riskView.status=id;
 if(action==='risk-clear'){riskSourceFilter='';riskFeatureFilter='';riskView.feature='全部功能';riskView.level='全部';riskView.status='全部';}
 if(action==='risk-export'){riskExportModal(id);return;}
 if(action==='risk-export-confirm'){
  const c=modalContext;if(c?.type!=='risk-export'||c.project!==P().id)return;
  const report=riskExportTarget(c.report),form=document.getElementById('riskExportForm');
  if(!report||report.state!=='已完成'||!form)return;
  const choices=riskExportChoices(form),rows=riskExportRows(report,choices.features,choices.statuses);
  if(!rows.length)return error('没有匹配的风险，请调整功能或处理状态。');
  download(report.id+'-风险清单.md',riskExportText(report,rows,choices));closeModal();toast('已导出 '+rows.length+' 条风险');return;
 }
 render();
}

function riskExportTarget(id){
 if(id!=='__aggregate__')return riskReports().find(r=>r.id===id);
 const sources=riskSourceReports(),features=[],featureLabels={},risks=[],handling={};
 for(const report of sources){
  for(const name of report.features){const key=JSON.stringify([report.id,name]);features.push(key);featureLabels[key]=name+' · '+report.title+' / '+report.id;}
  for(const risk of riskItems(report)){
   const key=JSON.stringify([report.id,risk.id]);risks.push({...risk,id:key,sourceRiskId:risk.id,feature:JSON.stringify([report.id,risk.feature]),featureName:risk.feature,analysisId:report.id,analysisTitle:report.title});
   if(report.handling[risk.id])handling[key]=report.handling[risk.id];
  }
 }

function localSessionPick(el){
 const chat=localSessionChat();for(const file of el.files)chat.attachments.push({name:file.name,size:file.size});
 el.value='';chat.attachments=chat.attachments.filter((f,i,a)=>a.findIndex(v=>v.name===f.name&&v.size===f.size)===i);save();render();
}
function localSessionOpenChat(feature='',riskId=''){
 const x=localSession(),report=localSessionReport(x);
 if(feature&&!report?.features.includes(feature))return;
 x.chatKey=feature?'feature:'+feature:'general';x.chatOpen=true;
 const chat=localSessionChat(x);if(riskId&&riskItems(report).some(r=>r.id===riskId&&r.feature===feature))chat.reference={reportId:report.id,riskId,feature};
 save();render();
}

)}</div><p class="hint">文件仅供当前对话；聊天不会自动修改风险或处理结论。</p></form></div></aside>`;

function localSessionSourceLinks(x){

 const rows=report?report.materials.map(m=>{const binding=report.bindings?.find?.(b=>b.source_id===m.source_id),doc=docs.find(d=>d.id===binding?.document_id);return {name:m.name,id:doc?.id||'',kind:doc?.materialKind==='prototype'?'prototypes':'documents'};}):[...LOCAL_SESSION_REQUIREMENTS.filter(m=>x.requirements.includes(m.id)).map(m=>({name:m.name,id:'',kind:'documents'})),...LOCAL_SESSION_PROTOTYPE_FILES.filter(m=>x.prototypeFiles.includes(m.id)).map(m=>({name:m.name,id:'',kind:'prototypes'})),...x.githubFiles.map(name=>({name,id:'',kind:'prototypes'})),...x.linkPages.map(id=>({name:LOCAL_SESSION_LINK_PAGES.find(p=>p.id===id)?.name||id,id:'',kind:'prototypes'}))];
 return rows.map(m=>'<div class="evidence">'+btn(esc(m.name)+' →','local-session-source-link',JSON.stringify([m.kind,m.id]),'link')+'</div>').join('')||'<p class="hint">未关联资料。</p>';

 `<p class="doc-note">HTML演示，不调用真实AI。不同对话的历史、草稿和附件独立；功能风险与人工处理在需求分析页维护。</p><div class="ls-conversation">${localSessionSidebar(x,report)}${x?localSessionChatPanel(x,report):'<section class="panel panel-pad"><h2>选择一个会话开始讨论</h2><p class="hint">左侧可打开历史会话或新建分析。</p></section>'}<aside class="panel panel-pad ls-context"><h3>本次上下文</h3>${x?`<p class="hint">当前讨论：${feature?esc(feature):'整个需求'}</p>${btn('补充资料','local-session-scope','','small')}<div class="mt">${localSessionSourceLinks(x)}</div><h3 class="mt">关联风险引用</h3>${relevant.map(r=>`<div class="evidence"><strong>${esc(r.id)} · ${esc(r.title)}</strong><div class="row">${btn('引用提问','local-session-cite',r.id,'link')}${btn('返回风险详情','local-session-risk-return',r.id,'link')}</div></div>`).join('')||'<p class="hint">当前没有关联风险，可先讨论需求和资料。</p>'}<p class="hint">引用用于明确提问对象；对话不会自动改写产品确认或处理状态。</p>`:''}</aside></div>`;
}
function localSessionSend(text){
 const x=localSession();if(!x)return '请先打开分析记录。';
 const cfg=personalAI();if(!cfg.configured||!cfg.model)return '请先配置你自己的AI服务。';
 text=String(text||'').trim();if(!text||text.length>3000)return '请输入1–3000字的内容。';
 const chat=localSessionChat(x),report=localSessionReport(x),feature=x.chatKey==='general'?'':x.chatKey.slice(8);
 chat.messages.push({role:'user',text,reference:clone(chat.reference||null),attachments:clone(chat.attachments),scope:localSessionScope(x),shared:report?{reportId:report.id,risks:clone(riskItems(report).filter(r=>!feature||r.feature===feature)),handling:clone(Object.fromEntries(Object.entries(report.handling).filter(([key])=>!feature||riskItems(report).some(r=>r.id===key&&r.feature===feature))))}:null,ai:{name:cfg.name,model:cfg.model}});
 chat.messages.push({role:'assistant',text:'演示回复：本次问题已记录到'+(feature?'“'+feature+'”独立对话':'需求分析对话')+'。正式调用将携带此对话历史、相关固定依据和最新产品确认。当前没有调用AI，聊天不会自动修改清单。需要入库时，请点击回复旁的“添加为风险点”并人工确认。'});
 chat.draft='';chat.reference=null;chat.attachments=[];save();return '';
}
function localSessionAddRiskModal(index){
 const x=localSession(),report=localSessionReport(x),chat=localSessionChat(x),message=chat.messages[Number(index)];
 if(!report||report.state!=='已完成')return toast('请先关联已入库的分析结果，再新增风险。');
 if(!message||message.role!=='assistant')return;
 const selection=typeof window!=='undefined'?String(window.getSelection?.()||'').trim():'';
 const quote=selection&&message.text.includes(selection)?selection:message.text;
 modalContext={type:'chat-risk-add',project:P().id,session:x.id,chatKey:x.chatKey,messageIndex:Number(index),messageText:message.text,quote,report:report.id};
 const field=(name,title,value='',required=true)=>label(title,`<textarea name="${name}" rows="2" maxlength="3000" ${required?'required':''}>${esc(value)}</textarea>`,'span2');
 openModal('人工添加风险点',`<form id="chatRiskForm"><p class="hint">只新增你确认的这一条风险。聊天引用是发现线索，不能代替需求或原型的原文依据。</p><details class="evidence"><summary>来源会话消息（保留引用）</summary><p>${esc(quote)}</p></details><div class="form-grid">${requirementSelect('所属功能','feature',report.features.map(f=>({value:f,label:f})),x.chatKey.startsWith('feature:')?x.chatKey.slice(8):'')}${requirementSelect('风险等级','level',['高','中','低'].map(v=>({value:v,label:v})),'中')}${label('风险标题',inp('title','','请概括一条具体风险','text',true),'span2')}${field('description','问题描述',quote)}${requirementSelect('原文来源（固定版本）','source',[{value:'',label:'请选择原始资料'},...report.materials.map((m,i)=>({value:String(i),label:m.name+' · '+(m.version||'固定快照')}))],'')}${label('原文位置',inp('location','','章节、页面或批注位置','text',true))}${field('excerpt','原文摘录（人工核对填写）')}${field('impact','可能影响')}${field('suggestion','完善建议')}${field('question','待产品确认的问题','',false)}</div><p class="hint">确认后状态为“待确认”，保留操作人和时间。取消不会入库。</p></form>`,btn('取消','close')+btn('确认入库','local-session-add-risk-confirm','','primary'),true);
 document.getElementById('dialog').classList.add('prototype-editor-dialog');
}
function localSessionAddRisk(context,data){
 const x=localSession();if(context?.type!=='chat-risk-add'||context.project!==P().id||!x||context.session!==x.id||context.chatKey!==x.chatKey)return '会话已变化，请重新打开新增窗口。';
 const report=localSessionReport(x),message=x.chats[context.chatKey]?.messages[context.messageIndex];
 if(!report||report.id!==context.report||!message||message.role!=='assistant'||message.text!==context.messageText)return '来源记录已变化，请重新选择。';
 if(context.saved)return '该次操作已入库，请勿重复提交。';
 if(!report.features.includes(data.feature)||!['高','中','低'].includes(data.level))return '请选择所属功能和风险等级。';
 for(const key of ['title','description','location','excerpt','impact','suggestion'])if(!String(data[key]||'').trim()||String(data[key]).length>3000)return '请补全标题、问题、原文依据、影响及建议，每项不超过3000字。';
 if(data.source===''||!/^\d+$/.test(String(data.source))||!report.materials[Number(data.source)])return '请选择原文资料，聊天内容不作为原文依据。';
 const source=report.materials[Number(data.source)],risk={id:'MR-'+crypto.randomUUID(),feature:data.feature,level:data.level,type:'人工补充',basis:'人工核对原文',title:data.title.trim(),description:data.description.trim(),impact:data.impact.trim(),suggestion:data.suggestion.trim(),question:String(data.question||'').trim(),tradeoff:'人工新增，待产品确认。',evidence:[{source:source.name+' · '+(source.version||'固定快照'),location:data.location.trim(),text:data.excerpt.trim()}],origin:{sessionId:x.id,chatKey:context.chatKey,messageIndex:context.messageIndex,quote:context.quote,actor:S.role,time:new Date().toLocaleString()}};
 report.manualRisks||=[];report.manualRisks.push(risk);context.saved=risk.id;save();return '';
}
function localSessionAction(action,id){
 if(action==='local-session-source-link'){let target;try{target=JSON.parse(id);}catch{return;}if(!Array.isArray(target)||!['documents','prototypes'].includes(target[0]))return;localSessionOpen=false;if(target[1]){if(target[0]==='documents')selectedDoc=target[1];else selectedPrototype=target[1];}navigate(target[0]);return;}
 if(action==='local-session-history'){localSession();localSessionOpen=true;closeModal();render();return;}
 if(action==='local-session-open'){localSessionCreateModal();return;}
 if(action==='local-session-ai'){localSessionOpen=false;closeModal();navigate('platform');return;}
 if(action==='local-session-create'){
  const d=formData('localSessionCreateForm');if(!d||modalContext?.project!==P().id)return;
  const title=String(d.title||'').trim(),focus=String(d.focus||'').trim();
  if(!title||!focus||title.length>200||focus.length>1000)return error('会话名称为1–200字，分析目标为1–1000字');
  const form=document.getElementById('localSessionCreateForm'),scope=localSessionReadScope(form);
  if(!Object.values(scope).some(items=>items.length))return error('请至少选择一项需求或原型资料。');
  const x={id:'AS-'+crypto.randomUUID(),title,focus,mainRequirement:null,scopeVersion:2,...scope,reports:[],chats:{general:{messages:[],draft:'',attachments:[]}},chatKey:'general',chatOpen:false};
  P().localAnalysisSessions||=[];P().localAnalysisSessions.unshift(x);P().localAnalysisActive=x.id;
  save();closeModal();localSessionOpen=true;render();return;
 }
 if(action==='local-session-select'){if(!P().localAnalysisSessions?.some(v=>v.id===id))return;P().localAnalysisActive=id;save();closeModal();localSessionOpen=true;render();return;}
 if(action==='local-session-close'){const report=localSessionReport();if(report)riskChoose(report.id);localSessionOpen=false;render();return;}
 if(action==='local-session-example'){
  let report=riskReports().find(r=>r.id==='RR-DEMO');if(!report){report=riskDemo();riskReports().unshift(report);}
  localSessionAttachReport(report);riskChoose(report.id);render();return;
 }
 if(action==='local-session-from-report'||action==='local-session-risk-chat'){
  const report=riskSelected();if(!report)return;const risk=riskItems(report).find(r=>r.id===id);
  localSessionAttachReport(report);closeModal();localSessionOpenChat(risk?.feature||'',risk?.id||'');return;
 }
 const x=localSession();if(!x)return;
 if(action==='local-session-add-risk'){localSessionAddRiskModal(id);return;}
 if(action==='local-session-add-risk-confirm'){const data=formData('chatRiskForm');if(!data)return;const problem=localSessionAddRisk(modalContext,data);if(problem)return error(problem);closeModal();render();toast('已新增待确认风险；原分析结果保持不变。');return;}
 if(action==='local-session-general'){localSessionOpenChat();return;}
 if(action==='local-session-feature-chat'){if(!localSessionOpen){const report=riskSelected();if(!report)return;localSessionAttachReport(report);}localSessionOpenChat(id);return;}
 if(action==='local-session-feature'){riskView.feature=id;render();return;}
 if(action==='local-session-chat-close'){x.chatOpen=false;save();render();return;}
 if(action==='local-session-cite'){const report=localSessionReport(),risk=riskItems(report).find(r=>r.id===id);if(!risk)return;localSessionChat().reference={reportId:report.id,riskId:id,feature:risk.feature};save();render();return;}
 if(action==='local-session-risk-return'){const report=localSessionReport();if(!riskItems(report).some(r=>r.id===id))return;riskChoose(report.id);localSessionOpen=false;render();riskDetail(id);return;}
 if(action==='local-session-unreference'){localSessionChat().reference=null;save();render();return;}
 if(action==='local-session-scope'){localSessionScopeModal();return;}
 if(action==='local-session-scope-view'){openModal('本次资料与范围',localSessionScopeSummary(localSessionScope(x)),btn('关闭','close'),true);return;}
 if(action==='local-session-attachment-remove'){localSessionChat().attachments.splice(Number(id),1);save();render();return;}
 if(action==='local-session-scope-save'){
  if(modalContext?.type!=='local-session-scope'||modalContext.project!==P().id||modalContext.session!==x.id)return;
  const form=document.getElementById('localSessionScopeForm'),scope=localSessionReadScope(form);
  if(!Object.values(scope).some(items=>items.length)&&!localSessionReport(x)?.materials.length)return error('请至少保留一项需求或原型资料。');
  localSessionSetScope(scope.requirements,scope.githubFiles,scope.linkPages,scope.prototypeFiles);
  closeModal();render();toast('补充范围已记录，原分析结果不变；后续聊天只用于讨论。');return;
 }
 if(action==='local-session-send'){const d=formData('localSessionForm');if(!d)return;const message=localSessionSend(d.message);if(message)return toast(message);render();return;}
}

      epoch !== d.epoch

      value.contract_version !== 1 ||
      !value.request_id

      (kind === "input" &&

document.addEventListener("change", (e) => {
  const el = e.target;
  if (el.dataset.cgSelect !== undefined) {
    el.checked
      ? cgSelection.add(el.dataset.cgSelect)
      : cgSelection.delete(el.dataset.cgSelect);
    render();
    return;
  }
  if (
    el.name === "cgKind" ||
    el.name === "cgStatus" ||
    el.name === "cgFunction"
  ) {
    cgFilters[
      { cgKind: "kind", cgStatus: "status", cgFunction: "function" }[el.name]
    ] = el.value;
    cgPage = 1;
    render();
    return;
  }
  if (!cgNew || modalContext?.type !== "cg-new" || cgNew.project !== P().id)
    return;
  if (el.name === "cgMode") {
    cgNew.mode = el.value === "首次生成" ? "INITIAL" : "UPDATE";
    cgNew.confirmed = false;
    cgNewRender();
  } else if (el.name === "cgBaseline") {
    cgNew.baseline = el.value;
    cgNew.confirmed = false;
    cgNewRender();
  } else if (el.dataset.cgSource !== undefined) {
    const m = cgCatalog().find((m) => m.id === el.dataset.cgSource);
    if (!m) return;
    if (el.checked)
      cgNew.selected[m.id] = {
        version: m.versions.at(-1),
        update: "完整替换",
        files: [],
        needsFiles: !!m.files,
      };
    else delete cgNew.selected[m.id];
    cgNew.confirmed = false;
    cgNewRender();
  } else if (el.dataset.cgVersion !== undefined) {
    cgNew.selected[el.dataset.cgVersion].version = el.value;
    cgNew.selected[el.dataset.cgVersion].files = [];
    cgNew.confirmed = false;
    cgNewRender();
  } else if (el.dataset.cgUpdate !== undefined) {
    cgNew.selected[el.dataset.cgUpdate].update = el.value;
    cgNew.confirmed = false;
    cgNewRender();
  } else if (el.dataset.cgFile !== undefined) {
    const s = cgNew.selected[el.dataset.cgFile];
    s.files = el.checked
      ? [...new Set([...s.files, el.value])]
      : s.files.filter((x) => x !== el.value);
    cgNew.confirmed = false;
    cgNewRender();
  } else if (el.name === "cgScope" || el.name === "cgCaseScope") {
    cgNew[el.name === "cgScope" ? "scope" : "caseScope"] = el.value;
    if (el.name === "cgCaseScope") {
      cgNew.caseIds = [];
      if (el.value === "所选分类") {
        cgNew.scopeCategory = "";
        cgNew.caseIds = P()
          .cases.filter((c) => c.lifecycle !== "RETIRED" && !c.categoryId)
          .map((c) => c.id);
      }
    }
    cgNew.confirmed = false;
    cgNewRender();
  } else if (el.name === "cgScopeCategory") {
    cgNew.scopeCategory = el.value;
    cgNew.caseIds = P()
      .cases.filter(
        (c) => c.lifecycle !== "RETIRED" && (c.categoryId || "") === el.value,
      )
      .map((c) => c.id);
    cgNew.confirmed = false;
    cgNewRender();
  } else if (el.dataset.cgCase !== undefined) {
    cgNew.caseIds ??= [];
    cgNew.caseIds = el.checked
      ? [...new Set([...cgNew.caseIds, el.dataset.cgCase])]
      : cgNew.caseIds.filter((x) => x !== el.dataset.cgCase);
    cgNew.confirmed = false;
    cgNewRender();
  }

function changeDetail(key){const r=changeActive(),x=r&&changeFind(r,key);if(!x)return;modalContext={type:'change-detail',record:r.id,key};const regression=r.regressions.includes(x);openModal(esc(x.key+' · '+x.title),`<div class="row">${tag(regression?'回归建议':r.impacts.includes(x)?'影响与风险':'变化项','blue')}${x.cause?tag(CHANGE_CAUSES[x.cause]):''}${x.evidence?tag(x.evidence):''}${x.severity?tag(x.severity+'风险','orange'):''}${x.handling?tag(x.handling.status):''}</div><h3 class="mt">${regression?'推荐原因':'业务说明'}</h3><p class="smalltext">${esc(x.text)}</p>${regression?`<div class="evidence"><strong>固定用例与建议动作</strong><p>${esc(x.caseRef)} · ${esc(x.suggested)}</p><p class="hint">KEEP保留设计，仍可纳入回归；停用建议不修改测试结果。</p></div><div class="evidence"><strong>前置条件与数据</strong><p>${esc(x.data)}</p><strong>操作</strong><p>${esc(x.action)}</p><strong>应核对结果</strong><p>${esc(x.expected)}</p></div>`:changeEvidence(x)}${x.chain?`<h3 class="mt">影响链 · 已读节点</h3>${x.chain.map(n=>`<div class="evidence mono">${esc(n)}</div>`).join('')}`:''}${x.attribution?`<h3 class="mt">归因依据</h3><p class="smalltext">${esc(x.attribution)}</p>`:''}${x.missing?`<h3 class="mt">待补充证据</h3>${x.missing.map(n=>`<p class="hint">${esc(n)}</p>`).join('')}`:''}${x.suggestion?`<div class="grid2 equal"><section class="evidence"><strong>修复/完善建议</strong><p>${esc(x.suggestion)}</p></section><section class="evidence"><strong>验证建议</strong><p>${esc(x.verification)}</p></section></div>`:''}${x.handling?`<form id="changeHandlingForm" class="evidence"><h3>人工${regression?'审阅':'处理'}</h3><div class="form-grid mt">${label('状态',select('status',regression?['待审阅','采纳','暂缓','不采纳']:['待处理','已确认','已处理','误报','需补充证据'],x.handling.status))}${label('处理说明',`<textarea name="comment" maxlength="4000" rows="3" placeholder="非默认状态须填写依据或原因">${esc(x.handling.note)}</textarea>`)}</div><p class="hint">${regression?'采纳只确认回归范围，不表示执行通过。':'处理只保存本次记录，不关闭旧风险、不修改原文。'}</p>${x.handling.history.map(h=>`<p class="hint">${esc(h.time)} · ${esc(h.actor)} · ${esc(h.status)}：${esc(h.note)}</p>`).join('')}</form>`:''}<p class="hint mt">${r.synthetic?'合成示例':'用户导入的展示结果'} · 静态分析未运行验证。</p>`,btn('关闭','close')+btn('引用追问','change-ask',key,'ghost')+(x.handling?btn('保存'+(regression?'审阅':'处理'),'change-handle',key,'primary'):''),true);}
function changeHandle(key){const r=changeActive(),x=r&&changeFind(r,key);if(!x?.handling||modalContext?.record!==r.id)return;const d=formData('changeHandlingForm');if(!d)return;const initial=r.regressions.includes(x)?'待审阅':'待处理';if(d.status!==initial&&!d.comment.trim())return error('请填写处理说明，采纳不等于已执行。');x.handling={status:d.status,note:d.comment,history:[...x.handling.history,{status:d.status,note:d.comment,time:new Date().toLocaleString('zh-CN'),actor:S.role}]};save();closeModal();render();toast('本次人工处理已保存（演示）；原报告与旧问题状态不变');}
function changeChatPage(r){return header('变更分析对话','围绕当前记录的新旧证据、影响归因和回归建议追问。',btn('返回变更分析','change-chat-back','','ghost'))+`<p class="notice">演示消息保存在本原型；不调用AI，不混入需求/代码聊天，不修改业务结果。</p><div class="code-chat-layout change-analysis-page">${changeNav()}<section class="panel code-chat-main"><div class="panel-head"><div><h2>${esc(r?.title||'尚无完成记录')}</h2><p class="hint">本记录独立历史 · 固定双版本上下文</p></div></div><div class="code-chat-messages">${(r?.chat||[]).map(m=>`<article class="code-chat-message ${m.role==='user'?'mine':''}"><strong>${m.role==='user'?'你':'AI演示回复'}</strong>${m.reference?`<p class="hint">引用 ${esc(m.reference)}</p>`:''}<p>${esc(m.text)}</p></article>`).join('')||'<p class="hint">暂无对话，可从变化或风险详情引用追问。</p>'}</div><form id="changeChatForm" class="code-chat-compose">${changeReference?`<p class="evidence">引用 ${esc(changeReference)} ${btn('移除引用','change-unref','','link small')}</p>`:''}${label('继续追问',`<textarea name="message" rows="3" maxlength="4000" required ${r?.status==='已完成'?'':'disabled'} placeholder="例如：为什么这项属于原有问题？回归还缺哪些证据？"></textarea>`)}<div class="between"><span class="hint">${r?.status==='已完成'?'只保存对话，不自动扩读或关闭风险':'完成记录才可讨论结果'}</span><button class="primary" ${r?.status==='已完成'?'':'disabled'}>发送（演示）</button></div></form></section><aside class="panel code-analysis-context"><h2>本记录上下文</h2>${changeScope(r)}</aside></div>`;}
function changeChatSend(message){const r=changeActive();if(r?.status!=='已完成'||!String(message||'').trim())return;r.chat.push({role:'user',text:String(message).trim(),reference:changeReference},{role:'assistant',text:changeReference?`演示回复：已引用 ${changeReference}。请对照该项固定新旧证据及归因缺口。采纳回归建议需要实际执行验证，当前聊天不会改变处理状态。`:'演示回复：当前只使用这条记录的固定双版本。未提供的依赖需补充后另行发起分析；不会自动读取或调用模型。'});changeReference='';save();render();}
function changeNew(){changeDraft={mode:'REQUIREMENT_CHANGE',source:'GitHub',title:'',requirementPair:'VERSION',requirementFile:false,requirementBase:false,requirementSupplement:false,before:'v1.2',after:'v1.3',update:'完整替换',targets:['业务变化与功能影响'],files:['backend'],code:false,materials:true,cases:false,history:false,focus:'',pair:true,partial:false};changeNewRender();}

function changePreflight(d){if(d.mode==='REQUIREMENT_CHANGE'&&(d.requirementPair==='SUPPLEMENT'?(!d.requirementBase||!d.requirementSupplement):!d.requirementFile))return '请勾选比较资料，并明确旧基准与新目标。';if(d.mode==='PROTOTYPE_CHANGE'&&!d.files.length)return '请读取并勾选原型文件或页面范围。';if(!d.targets.length)return '请至少选择一个分析目标。';if(!d.before||!d.after)return '必须提供实际可用的新旧固定版本；无旧快照不能变更分析。';if(d.before===d.after)return '两侧版本相同：仅展示无差异，不创建分析任务；可选择其他基准。';if(!d.pair)return '请核对新旧资料/代码的同范围对应关系。';if(d.mode==='CODE_CHANGE'){if(!d.files.length)return '请从文件树选择比较范围。';if(d.targets.includes('前后端一致性')&&(!d.files.includes('backend')&&!d.files.includes('backend-context')||!d.files.includes('client')&&!d.files.includes('client-context')))return '前后端一致性缺少目标侧后端或前端/移动端文件，整次创建拦截。';if(d.targets.length===1&&d.targets[0]==='需求符合性'&&!d.materials)return '仅做需求符合性时须选择实际可读的需求/原型依据。';}return '';}
function changeRequirementPair(d){const same=d.requirementPair!=='SUPPLEMENT';return `<section class="evidence"><div class="row"><button type="button" class="${same?'primary':'ghost'}" onclick="changeNewCapture();changeDraft.requirementPair='VERSION';changeDraft.before='v1.2';changeDraft.after='v1.3';changeDraft.update='完整替换';changeDraft.pair=false;changeNewRender()">同一资料版本对比</button><button type="button" class="${same?'ghost':'primary'}" onclick="changeNewCapture();changeDraft.requirementPair='SUPPLEMENT';changeDraft.before='核销需求说明.md @ v1.2';changeDraft.after='核销补充说明.md @ v1.3';changeDraft.update='增量补充';changeDraft.pair=false;changeNewRender()">两份文件增量补充</button></div>${same?`<label class="check mt"><input type="checkbox" name="requirementFile" onchange="changeNewCapture();changeNewRender()" ${d.requirementFile?'checked':''}><span>核销需求说明.md（合成资料）</span></label><div class="form-grid mt" ${d.requirementFile?'':'hidden'}>${label('旧基准',select('before',['','v1.2','v1.3'],d.before))}${label('新目标',select('after',['','v1.3','v1.2'],d.after))}</div><p class="hint">勾选同一资料后明确选择两个版本；默认上一版对最新版，相同版本不能比较。</p>`:`<div class="form-grid mt"><section><strong>旧基准文件</strong><label class="check mt"><input type="checkbox" name="requirementBase" ${d.requirementBase?'checked':''}><span>核销需求说明.md</span></label>${label('旧基准版本',select('before',['','核销需求说明.md @ v1.2'],d.before))}</section><section><strong>新版补充文件</strong><label class="check mt"><input type="checkbox" name="requirementSupplement" ${d.requirementSupplement?'checked':''}><span>核销补充说明.md</span></label>${label('补充文件版本',select('after',['','核销补充说明.md @ v1.3'],d.after))}</section></div><p class="hint">旧基准文件＋新版补充文件；未提及的旧规则继续适用，不按未出现判删除。</p>`}${label('本组更新方式',select('update',same?['完整替换','增量补充']:['增量补充'],d.update))}</section>`;}

const CHANGE_GIT_VERSIONS={branches:[{name:'main',sha:'b'.repeat(40)},{name:'release',sha:'a'.repeat(40)}],tags:[{name:'v1.2',sha:'a'.repeat(40)},{name:'v1.3',sha:'b'.repeat(40)}],commits:[{name:'修正核销门店校验 · 2026-10-08 10:20',sha:'b'.repeat(40)},{name:'新增手动核销原型 · 2026-10-07 15:30',sha:'a'.repeat(40)},{name:'核销原型初版 · 2026-10-06 09:00',sha:'c'.repeat(40)}]};
function changeGitVersionSelector(side,d){const field=side+'VersionKind',kind=d[field]||'commits';return `<section class="evidence"><h3>${side==='before'?'旧基准':'新目标'}</h3>${label('版本类型',`<select name="${field}" onchange="changeNewCapture();changeDraft.${side}='';changeDraft.${side}VersionsLoaded=false;changeDraft.files=[];changeDraft.pair=false;changeNewRender()"><option value="commits" ${kind==='commits'?'selected':''}>提交历史</option><option value="branches" ${kind==='branches'?'selected':''}>分支</option><option value="tags" ${kind==='tags'?'selected':''}>Tag</option></select>`)}<button type="button" class="small mt" onclick="changeNewCapture();changeDraft.${side}VersionsLoaded=true;changeNewRender()">读取版本列表（演示）</button>${d[side+'VersionsLoaded']?`<div class="stack mt">${CHANGE_GIT_VERSIONS[kind].map(v=>`<button type="button" class="${d[side]===v.sha?'primary':'ghost'}" style="text-align:left;justify-content:flex-start;white-space:normal" onclick="changeNewCapture();changeDraft.${side}='${v.sha}';changeDraft.files=[];changeDraft.pair=false;changeDraft.prototypeRead=false;changeNewRender()"><span>${esc(v.name)}<br><small class="mono">${v.sha.slice(0,12)}</small></span></button>`).join('')}</div>`:''}<input type="hidden" name="${side}" value="${esc(d[side])}"><p class="hint mono mt">已选：${esc(d[side]||'尚未选择')}</p><p class="hint">内置合成版本用于演示，不读取真实仓库。</p></section>`;}

function changeNewRender(){const d=changeDraft,req=d.mode==='REQUIREMENT_CHANGE',proto=d.mode==='PROTOTYPE_CHANGE';modalContext={type:'change-new'};const targetNames=req?['业务变化与功能影响','代码实现跟进','用例维护与回归建议']:proto?['原型行为变化与功能影响','代码实现跟进','用例维护与回归建议']:['代码Bug','需求符合性','前后端一致性'];openModal('新建变更分析',`<form id="changeNewForm"><p class="notice">交互演示 · 只保存选择范围，不读取真实仓库/目录、不发送资料、不调用AI。</p>${label('分析名称',`<input name="title" value="${esc(d.title)}" required maxlength="200" placeholder="例如：核销门店规则补充">`)}<h3 class="mt">变更方式</h3><div class="row mt">${Object.entries(CHANGE_MODES).map(([key,name])=>`<button type="button" class="${d.mode===key?'primary':'ghost'}" aria-pressed="${d.mode===key}" data-action="change-new-mode" data-id="${key}">${name}</button>`).join('')}</div><h3 class="mt">分析目标</h3><div class="stack mt">${targetNames.map(t=>`<label class="check"><input type="checkbox" name="target" value="${t}" ${d.targets.includes(t)?'checked':''}><span>${t}</span></label>`).join('')}</div><h3 class="mt">${req?'资料配对 · 固定版本':'代码来源与新旧比较'}</h3>${req?changeRequirementPair(d):proto?changePrototypeScope(d):label('代码来源',select('source',['GitHub','本地双快照'],d.source))}${req||proto?'':d.source==='GitHub'?`<div class="form-grid mt">${changeGitVersionSelector('before',d)}${changeGitVersionSelector('after',d)}</div>`:`<div class="form-grid mt">${label('旧基准',select('before',req?['','v1.2','v1.3']:d.source==='GitHub'?['','1a7c092','8f31b2a']:['','读取快照 #1','读取快照 #2'],d.before))}${label('新目标',select('after',req?['','v1.3','v1.2']:d.source==='GitHub'?['','8f31b2a','1a7c092']:['','读取快照 #2','读取快照 #1'],d.after))}</div>`}${proto?'':req?'<p id="changeUpdateHint" class="hint"></p><label class="check mt"><input type="checkbox" name="partial" '+(d.partial?'checked':'')+'><span>新版只选部分章节（未选旧规则不判删除）</span></label>':`<section class="evidence"><div class="between"><h3>文件树 · 两侧相同范围</h3><div class="row">${btn('全选','change-files-all','','small')}${btn('清空','change-files-clear','','small')}</div></div><p class="hint">${d. // GitHub connection prototype: metadata only, no token storage or external requests.
let ghDraft=null,ghDraftRole='',ghMessage='',ghTested=false,ghRepos=[],ghQuery='';
function ghConnections(){return (S.githubConnections||[]).filter(c=>c.localOwner===S.role);}
function ghNew(){ghDraft={id:'',name:'',tokenType:'classic',githubLogin:'demo-user',url:'https://api.github.com',selected:[],configured:false};ghDraftRole=S.role;ghMessage='';ghTested=false;ghRepos=[];ghQuery='';}
function ghUpdate(el){
 if(!['name','tokenType','token'].includes(el.name))return;
 if(el.name==='token'){ghTested=false;ghMessage='凭据输入已改变，请重新模拟测试。';document.getElementById('ghStatus').textContent=ghMessage;return;}
 ghDraft[el.name]=el.value;
 if(el.name!=='name'){ghTested=false;ghRepos=[];ghDraft.selected=[];ghMessage='连接信息已改变，请重新测试并选择仓库。';}
 if(el.name==='tokenType'){render();}
 else if(el.name!=='name'){document.getElementById('ghStatus').textContent=ghMessage;document.getElementById('ghRepositories').innerHTML=ghRepositoryList();}
}
function ghRepositoryList(){
 if(!ghTested)return '<p class="hint">完成连接测试后，在此勾选允许平台读取的仓库。</p>';
 const repos=ghRepos.filter(r=>r.name.toLowerCase().includes(ghQuery.toLowerCase()));if(!repos.length)return '<p class="hint">没有匹配的仓库。</p>';
 const owners=[...new Set(repos.map(r=>r.name.split('/')[0]))];return owners.map(owner=>`<div class="gh-owner-group"><h4 class="gh-owner-title">${owner==='demo-user'?'个人':'组织'} · ${esc(owner)}</h4>${repos.filter(r=>r.name.startsWith(owner+'/')).map(r=>`<label class="gh-repo-card"><input type="checkbox" value="${esc(r.name)}" ${ghDraft.selected.includes(r.name)?'checked':''} onchange="ghChoose(this)"><span><strong>${esc(r.name)}</strong><br><span class="hint">${r.private?'私有':'公开'} · 示例仓库 · 只读</span></span></label>`).join('')}</div>`).join('');
}
function ghChoose(el){ghDraft.selected=el.checked?[...new Set([...ghDraft.selected,el.value])]:ghDraft.selected.filter(v=>v!==el.value);document.getElementById('ghCount').textContent=ghDraft.selected.length;}
function githubSection(){
 if(!ghDraft||ghDraftRole!==S.role)ghNew();
 return `<div class="row between"><h2>GitHub 连接配置</h2>${btn('新增连接','gh-new','','primary')}</div>
 ${note('交互原型：个人与组织、账号和仓库均为演示；不会访问 GitHub，不提交、不验证、不保存 Token。请勿填写真实凭据。')}
 <p class="hint mt">每位平台用户独立管理多个连接。当前演示账号：${esc(S.role)}（切换顶部角色体验账号隔离）。组织仓库可见性受本人权限、Token 授权和组织审批限制；不自动共享给其他用户。</p>
 <section class="gh-section mt"><div class="gh-section-head"><div><h3>我的连接</h3><p>选择一项连接，在下方查看或修改配置。</p></div><span class="badge green">${ghConnections().length} 个连接</span></div><div class="gh-connection-list">${ghConnections().length?ghConnections().map(c=>`<div class="gh-connection-card ${ghDraft.id===c.id?'active':''}"><span class="gh-card-icon">${icon('github')}</span><div><strong>${esc(c.name)}</strong>${ghDraft.id===c.id?'<span class="badge green">正在编辑</span>':''} <span class="hint">${c.tokenType==='classic'?'Classic Token':'Fine-grained Token'} · ${esc(c.githubLogin||'demo-user')} · 已选 ${c.selected.length} 个仓库 · 演示配置</span></div><div class="row">${btn('修改','gh-edit',c.id)}${btn(icon('trash')+'删除','gh-delete',c.id,'danger')}</div></div>`).join(''):'<p class="muted mt">暂无连接。可分别为个人账号及加入的组织新增连接。</p>'}</div></section>
 <div class="divider"></div><h3>${ghDraft.id?'修改连接':'新增连接'}</h3>
 <form id="githubForm" class="mt" oninput="ghUpdate(event.target)" onchange="if(event.target.name==='tokenType')ghUpdate(event.target)"><div class="form-grid">
 ${label('连接名称',inp('name',ghDraft.name,'例如：我的个人仓库 / 组织研发仓库','text',true),'span2')}
 ${label('访问方式',`<select name="tokenType"><option value="classic" ${ghDraft.tokenType==='classic'?'selected':''}>Classic Token</option><option value="fine_grained" ${ghDraft.tokenType!=='classic'?'selected':''}>Fine-grained Token</option><option disabled>GitHub App（待支持）</option></select>`)}
 ${label('API 地址','<input name="url" type="url" value="https://api.github.com" readonly>')}
 ${label('访问凭据',inp('token','',ghDraft.configured?'已有凭据状态（演示）；留空保留、填写替换':'仅演示输入，请勿填写真实 Token','password'),'span2')}
 </div><p class="hint mt">正式接入支持 Classic（ghp_）和 Fine-grained（github_pat_）。Classic 可复用于本人获授权的个人/组织仓库；私有仓库通常需 repo 权限（包含写入能力），但平台始终只读。Fine-grained 使用 Contents Read / Metadata Read。无需连接类型或组织名，测试后自动按仓库所属个人/组织分组；切换访问方式需填写对应Token。凭据加密保存，不回显。</p>
 <div class="divider"></div>${label('演示测试结果',`<select id="ghScenario"><option value="success">成功：显示授权仓库（模拟）</option><option value="invalid">凭据无效 / 已过期（模拟）</option><option value="denied">权限不足（模拟）</option><option value="approval">组织可能待审批（模拟）</option><option value="empty">未找到可访问仓库（模拟）</option><option value="limited">请求限流（模拟）</option><option value="timeout">网络超时（模拟）</option></select>`)}
 <div class="row mt">${btn('测试连接（模拟）','gh-test')}</div><p id="ghStatus" class="mt" role="status" aria-live="polite">${esc(ghMessage)}</p>
 <div class="divider"></div><section class="gh-section"><div class="gh-section-head"><div><h3>允许读取的仓库</h3><p>勾选后才会加入本连接的读取范围。</p></div><span class="badge green">已选 <span id="ghCount">${ghDraft.selected.length}</span> 个</span></div><div class="gh-repository-body">
 <label class="mt">搜索仓库<input type="search" value="${esc(ghQuery)}" placeholder="按仓库名称搜索" oninput="event.stopPropagation();ghQuery=this.value;document.getElementById('ghRepositories').innerHTML=ghRepositoryList()"></label>
 <div id="ghRepositories" class="mt">${ghRepositoryList()}</div></div></section><p class="hint mt">仅勾选的仓库可供后续模块读取。当前不拉取代码、不建立快照、不进行 AI 分析；不能推送、修改远端文件或创建 PR。</p>
 <div class="row mt">${btn('保存配置（演示）','gh-save','','primary')}${btn('取消编辑','gh-new')}</div></form>`;
}
function ghAction(action,id){
 if(!ghDraft||ghDraftRole!==S.role)ghNew();
 if(action==='gh-new'){ghNew();render();return;}
 if(action==='gh-delete'){const c=ghConnections().find(c=>c.id===id);if(!c)return;modalContext={type:'gh-delete',id,localOwner:S.role};openModal('删除 GitHub 连接',`<p>确认删除连接“${esc(c.name)}”？仅移除本平台的连接与仓库授权清单，不删除GitHub仓库、不撤销远端Token。</p><p class="hint mt">项目关联和历史资料保留，后续读取需要有效个人连接。此处为演示操作。</p>`,btn('取消','close')+btn('确认删除连接','gh-delete-confirm',id,'danger'));return;}
 if(action==='gh-delete-confirm'){if(modalContext?.type!=='gh-delete'||modalContext.id!==id||modalContext.localOwner!==S.role)return;S.githubConnections=(S.githubConnections||[]).filter(c=>c.id!==id||c.localOwner!==S.role);if(ghDraft?.id===id)ghNew();save();closeModal();render();toast('演示连接已删除，远端仓库未修改');return;}
 if(action==='gh-edit'){const c=ghConnections().find(c=>c.id===id);if(!c)return;ghDraft=JSON.parse(JSON.stringify(c));ghRepos=c.selected.map(name=>({name,private:true}));ghTested=false;ghMessage='已加载演示配置。请重新测试后保存；Token 未保存、不会回显。';ghQuery='';render();return;}
 if(action==='gh-test'){
  const f=document.getElementById('githubForm');if(!themeValidateForm(f))return;
  const outcome=document.getElementById('ghScenario').value;ghTested=outcome==='success';ghRepos=[];ghDraft.selected=[];
  const errors={invalid:'凭据无效或已过期。',denied:'无权读取仓库，请检查 Contents Read 与仓库授权。',approval:'组织仓库可能待管理员审批，或组织策略禁止 Token 访问，请在 GitHub 核对。',empty:'未找到可访问仓库，不能判定连接成功。',limited:'GitHub 请求受到限流，请稍后重试。',timeout:'连接超时，未确认访问能力，请稍后重试。'};
  if(ghTested){ghRepos=(ghDraft.tokenType==='classic'?['demo-user/demo-backend','demo-team/demo-web','another-team/demo-docs']:['demo-team/demo-backend','demo-team/demo-web']).map((name,i)=>({name,private:i!==2}));ghMessage='✓ 连接测试成功（模拟）：已自动发现并分组示例仓库，请勾选后保存。没有真实验证身份或权限。';}
  else ghMessage='模拟结果：'+errors[outcome];render();return;
 }
 if(action==='gh-save'){
  if(!themeValidateForm(document.getElementById('githubForm')))return;
  if(!ghTested){ghMessage='请先完成成功的模拟测试，再保存。';document.getElementById('ghStatus').textContent=ghMessage;return;}
  if(!ghDraft.selected.length){ghMessage='请至少勾选一个允许读取的仓库。';document.getElementById('ghStatus').textContent=ghMessage;return;}
  const c={id:ghDraft.id||'gh-'+Date.now(),localOwner:S.role,name:ghDraft.name.trim(),tokenType:ghDraft.tokenType||'fine_grained',githubLogin:'demo-user',url:'https://api.github.com',method:'Personal Access Token',selected:[...ghDraft.selected],configured:true};
  S.githubConnections=(S.githubConnections||[]).filter(v=>v.id!==c.id||v.localOwner!==S.role);S.githubConnections.push(c);save();ghDraft=c;ghMessage='✓ 演示配置已保存，仅保存非敏感元数据及仓库选择；Token 未保存。';render();
 }
}

function localCodeAction(action,id){

function localRefresh(index){
 const row=(P().localCode||[])[index];if(!row)return;

 if(round%2===1){if(keys[0])after[keys[0]]='演示内容 v'+(round+1);if(keys.length>1)delete after[keys[keys.length-1]];after['demo/added-'+round+'.txt']='新增演示文件';}
 const changes=[];
 for(const path of new Set([...Object.keys(before),...Object.keys(after)])){
  const kind=!(path in before)?'新增':!(path in after)?'删除':before[path]!==after[path]?'修改':null;
  if(kind)changes.push({path,kind,before:before[path]??null,after:after[path]??null});

}

function themeUpgradeControls(){

 document.querySelectorAll('select,input[list],input[data-theme-list]').forEach(source=>{

<script id="pagination-jump-behavior">
function prototypePageJump(control) {
  const root=control.closest('.page-jump'), input=root.querySelector('input');
  if(input.disabled)return;
  const value=input.value.trim(), page=Number(value), max=Number(root.dataset.pageMax), current=Number(root.dataset.pageCurrent), error=root.querySelector('[role=alert]');
  if(!/^\d+$/.test(value)||!Number.isSafeInteger(page)||page<1||page>max){error.textContent=`请输入1至${max}之间的整数页码。`;input.setAttribute('aria-invalid','true');input.focus();return;}
  error.textContent='';input.removeAttribute('aria-invalid');
  if(page===current)return;
  const action=document.createElement('button');action.type='button';action.hidden=true;action.dataset.action=root.dataset.pageAction;action.dataset.id=String(root.dataset.pageDelta==='true'?page-current:page);root.append(action);action.click();action.remove();
  const replacement=[...document.querySelectorAll('.page-jump')].find(r=>r.dataset.pageAction===root.dataset.pageAction);replacement?.querySelector('input')?.focus();
}

  const host = document.createElement('aside');
  host.id = 'businessRules';
  host.setAttribute('aria-label', '页面与操作业务规则');
  host.setAttribute('popover', 'manual');
  host.innerHTML = `<header class="br-header"><div class="br-heading"><strong>业务规则</strong><span class="br-subtitle">填写要求和操作说明</span></div><button type="button" id="brToggle" aria-expanded="true" aria-controls="brBody">收起说明</button></header><div id="brBody"><div class="br-context" aria-live="polite"></div><label class="br-search">搜索本页说明<input type="search" placeholder="历史版本、重复用例、文件大小" aria-label="查找业务规则"></label><div class="br-toolbar"><button type="button" data-br-action="expand">全部展开</button><button type="button" data-br-action="collapse">全部收起</button><button type="button" data-br-action="current">当前操作</button></div><div class="br-current"></div><div class="br-catalog"></div><p class="br-foot">本原型仅作演示，不执行真实分析。</p></div>`;
  const body = host.querySelector('#brBody');
  const list = host.querySelector('.br-catalog');
  const search = host.querySelector('input');
  const toggle = host.querySelector('#brToggle');
  const states = new Map();
  const escape = (value) => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  let contextKey = '', currentIds = [], pageKey = '', modalTitle = '', lastDialog = null;
  let collapsed = matchMedia('(max-width: 1000px)').matches;
  function setCollapsed(value) {
    collapsed = value;
    document.body.classList.toggle('rules-collapsed', value);
    host.classList.toggle('br-collapsed', value);
    toggle.textContent = value ? '业务说明' : '收起说明';
    toggle.setAttribute('aria-expanded', String(!value));
    body.hidden = value;
  }
  function score(entry, text, title) {
    const identities = text.split('|');
    return Math.max(0, ...entry.matches.filter(Boolean).map(word => {
      if (title === word) return 200 + word.length;
      if (title.includes(word)) return 100 + word.length;
      if (identities.includes(word)) return 50 + word.length;
      return 0;
    }));
  }
  function render() {
    const data = catalog[pageKey] || catalog.overview;
    const query = search.value.trim().toLocaleLowerCase();
    const entries = data.entries.filter(entry => !query || JSON.stringify([entry.title, entry.groups]).toLocaleLowerCase().includes(query));
    host.querySelector('.br-context').innerHTML = `<span>当前页面</span><strong>${escape(data.name)}</strong>${modalTitle ? `<span>当前操作</span><strong>${escape(modalTitle)}</strong>` : ''}`;
    host.querySelector('.br-current').textContent = modalTitle
      ? (currentIds.length ? '已展开当前操作的说明。' : '请在下方选择要查看的操作。')
      : `本页共${data.entries.length}项说明`;
    list.innerHTML = entries.map(entry => {
      const active = currentIds.includes(entry.id);
      const open = states.get(pageKey + ':' + entry.id) ?? (active || (!modalTitle && entry === data.entries[0]));
      return `<details class="br-entry${active ? ' br-active' : ''}" data-rule-id="${entry.id}" ${open ? 'open' : ''}><summary>${escape(entry.title)}${active ? '<span class="br-badge">当前操作</span>' : ''}</summary><div class="br-entry-body">${entry.groups.map(group => `<section><h4>${escape(group.title)}</h4><ul>${group.rules.map(rule => `<li>${escape(rule)}</li>`).join('')}</ul></section>`).join('')}</div></details>`;
    }).join('') || '<p class="br-empty">本页没有匹配的规则，请更换关键词。</p>';
  }
  function update() {
    // The host is moved into the topmost modal so it stays operable under modal inertness.
    const dialogs = [...document.querySelectorAll('dialog[open]')];
    const dialog = dialogs.at(-1) || null;
    const parent = dialog || document.body;
    if (host.parentElement !== parent) {
      if (host.matches(':popover-open')) host.hidePopover();
      parent.append(host);
      host.showPopover();
    } else if (!host.matches(':popover-open')) host.showPopover();
    document.querySelectorAll('dialog.br-has-rules').forEach(d => {
      if (d !== dialog) d.classList.remove('br-has-rules');
    });
    dialog?.classList.add('br-has-rules');
    // Never include the annotation tree itself in the modal's matching text.
    const title = dialog?.querySelector('#modalTitle, .modal-header h2, h2')?.textContent?.trim() || '';
    const forms = dialog ? [...dialog.querySelectorAll('form')].map(f => f.id).join('|') : '';
    const type = typeof modalContext === 'object' && modalContext ? modalContext.type || '' : '';
    const key = typeof page === 'string' && catalog[page] ? page : 'overview';
    const signature = [key, title, forms, dialog ? type : ''].join('|');
    if (contextKey === signature && lastDialog === dialog) return;
    const newPage = key !== pageKey;
    contextKey = signature;
    pageKey = key;
    modalTitle = title;
    lastDialog = dialog;
    if (newPage) search.value = '';
    const scored = catalog[key].entries.map(entry => ({ id: entry.id, score: score(entry, forms + '|' + type, title) }));
    const best = Math.max(0, ...scored.map(item => item.score));
    currentIds = dialog && best ? scored.filter(item => item.score === best).map(item => item.id) : [];
    currentIds.forEach(id => states.set(pageKey + ':' + id, true));
    render();
    host.querySelector('.br-active')?.scrollIntoView({ block: 'nearest' });
  }
  toggle.addEventListener('click', () => setCollapsed(!collapsed));
  search.addEventListener('input', render);
  list.addEventListener('toggle', event => {
    const entry = event.target;
    if (entry instanceof HTMLDetailsElement && entry.dataset.ruleId)
      states.set(pageKey + ':' + entry.dataset.ruleId, entry.open);
  }, true);
  host.addEventListener('click', event => {
    const action = event.target.closest('[data-br-action]')?.dataset.brAction;
    if (!action) return;
    if (action === 'current') {
      search.value = '';
      currentIds.forEach(id => states.set(pageKey + ':' + id, true));
      render();
      host.querySelector('.br-active')?.scrollIntoView({ block: 'nearest' });
      return;
    }
    for (const entry of list.querySelectorAll('.br-entry')) {
      entry.open = action === 'expand';
      states.set(pageKey + ':' + entry.dataset.ruleId, entry.open);

  // Batch changes and ignore annotation mutations, avoiding a self-triggered render loop.
  let scheduled = false;
  new MutationObserver(records => {

    if (scheduled) return;
    scheduled = true;
    queueMicrotask(() => { scheduled = false; update(); });
  }).observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ['open'] });
  window.addEventListener('hashchange', update);
  setCollapsed(collapsed);
  update();
})();
</script>
</body>
